name: Validate unified access console stage 4
on:
  push:
    branches: [feature/access-unified-stage4]
    paths: ['.github/staging/access-console-stage4/**', '.github/workflows/validate-access-console-stage4.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'PaV1LIaN/sitebuilder' && github.ref == 'refs/heads/feature/access-unified-stage4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sitebuilder_access_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SB_TEST_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=sitebuilder_access_test'
      SB_TEST_PG_USER: postgres
      SB_TEST_PG_PASSWORD: postgres
      SB_ACCESS_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch on unchanged tested groups baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 4c9afe496edeb8368deca6b5cfff5fa1b8890e85 HEAD -- . ':!.github/staging/access-console-stage4/**' ':!.github/workflows/validate-access-console-stage4.yml'
          cat .github/staging/access-console-stage4/patch.b64.{1,2,3} | base64 --decode | xz --decompress > /tmp/access-stage4.patch
          echo '427252f49e0c866a5cd3ac80c79c6b73817bc914f9265926b677ca7658161d25  /tmp/access-stage4.patch' | sha256sum --check
          git apply --check /tmp/access-stage4.patch
          git apply /tmp/access-stage4.patch
          shopt -s nullglob
          for patch in .github/staging/access-console-stage4/*.fix.patch; do git apply --check "$patch"; git apply "$patch"; done
          git diff --check
          git diff --exit-code -- config/auth.php config/auth.local.php lib/db.php router.php public.php migrations
      - name: Syntax and isolated regression on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /tmp/access-stage4-lint.log
          node --check assets/admin/access.js
          node --check assets/admin/groups.js
          node --check assets/admin/access-console.js
          result=0
          for test in access_admin_unit access_subject_identity page_access_policy access_native_disk bitrix_disk_gate disk_delete_action disk_download_action disk_permission_admin sitebuilder_admin_config sitebuilder_deploy_readonly disk_user_search access_console_policy access_admin_pg access_native_journal_pg access_migration_registry_pg access_groups_pg; do
            echo "=== $test ===" | tee -a /tmp/access-stage4-tests.log
            php "tests/${test}_test.php" 2>&1 | tee -a /tmp/access-stage4-tests.log || result=1
          done
          exit "$result"
      - name: Commit validated code to feature branch only
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin refs/heads/feature/access-unified-stage4 | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify objects groups and employee access administration without migrating existing permissions'
          git push origin HEAD:refs/heads/feature/access-unified-stage4
          git rev-parse HEAD | tee -a /tmp/access-stage4-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-console-stage4-validation
          path: |
            /tmp/access-stage4-tests.log
            /tmp/access-stage4-lint.log
          if-no-files-found: warn
          retention-days: 30
