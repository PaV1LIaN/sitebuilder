name: Disk download regression
on:
  push:
    paths:
      - 'components/disk/actions/download.php'
      - 'tests/disk_download_action_test.php'
      - '.github/workflows/disk-download.yml'
  pull_request:
    paths:
      - 'components/disk/actions/download.php'
      - 'tests/disk_download_action_test.php'
      - '.github/workflows/disk-download.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: php -l components/disk/actions/download.php
      - run: php -l tests/disk_download_action_test.php
      - run: php tests/disk_download_action_test.php
      - run: php tests/disk_permission_admin_test.php
      - run: php tests/bitrix_disk_gate_test.php
      - run: php tests/sitebuilder_deploy_readonly_test.php
