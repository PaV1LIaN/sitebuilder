name: Disk delete
on:
  push:
    paths:
      - 'components/disk/api.php'
      - 'components/disk/actions/delete.php'
      - 'components/disk/bootstrap.php'
      - 'components/disk/lib/DiskBitrixStorageAdapter.php'
      - 'components/disk/lib/DiskDeleteErrorResponder.php'
      - 'components/disk/script.js'
      - 'tests/disk_delete_test.php'
      - '.github/workflows/disk-delete.yml'
  pull_request:
    paths:
      - 'components/disk/api.php'
      - 'components/disk/actions/delete.php'
      - 'components/disk/bootstrap.php'
      - 'components/disk/lib/DiskBitrixStorageAdapter.php'
      - 'components/disk/lib/DiskDeleteErrorResponder.php'
      - 'components/disk/script.js'
      - 'tests/disk_delete_test.php'
      - '.github/workflows/disk-delete.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: php -l components/disk/api.php
      - run: php -l components/disk/actions/delete.php
      - run: php -l components/disk/bootstrap.php
      - run: php -l components/disk/lib/DiskBitrixStorageAdapter.php
      - run: php -l components/disk/lib/DiskDeleteErrorResponder.php
      - run: php tests/disk_delete_test.php
