name: Stage 2 isolated validation and branch update
on:
  push:
    branches: [feature/access-admin-stage1]
    paths: ['.github/staging/access-stage2/**', '.github/workflows/apply-access-stage2.yml']
permissions:
  contents: write
jobs:
  validate-and-apply:
    if: github.repository == 'PaV1LIaN/sitebuilder' && github.ref == 'refs/heads/feature/access-admin-stage1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sitebuilder_access_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SB_TEST_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=sitebuilder_access_test'
      SB_TEST_PG_USER: postgres
      SB_TEST_PG_PASSWORD: postgres
      SB_ACCESS_TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed patch on unchanged stage 1 code
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 70330c5c6d72372c08144a8e3c988ae682c66df8 HEAD -- . ':!.github/staging/access-stage2/**' ':!.github/workflows/apply-access-stage2.yml'
          cat .github/staging/access-stage2/patch.b64.1 .github/staging/access-stage2/patch.b64.2 | base64 --decode | xz --decompress > /tmp/stage2.patch
          echo '5b3e8de2a0e8168fb388cc6ffc272f01c096ac54002c90953dd27fc002f20e47  /tmp/stage2.patch' | sha256sum --check
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          shopt -s nullglob
          for patch in .github/staging/access-stage2/*.fix.patch; do git apply --check "$patch"; git apply "$patch"; done
          git diff --check
          git diff --exit-code -- config/auth.php config/auth.local.php
      - name: Validate syntax and isolated permissions tests
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /tmp/stage2-lint.log
          node --check assets/admin/access.js
          result=0
          for test in access_admin_unit access_subject_identity page_access_policy access_native_disk bitrix_disk_gate disk_delete_action disk_download_action disk_permission_admin sitebuilder_admin_config sitebuilder_deploy_readonly disk_user_search access_admin_pg access_native_journal_pg; do
            echo "=== $test ===" | tee -a /tmp/stage2-tests.log
            php "tests/${test}_test.php" 2>&1 | tee -a /tmp/stage2-tests.log || result=1
          done
          exit "$result"
      - name: Commit validated code to the existing feature branch only
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin refs/heads/feature/access-admin-stage1 | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement page denial and native Disk batch administration (stage 2)'
          git push origin HEAD:refs/heads/feature/access-admin-stage1
          git rev-parse HEAD | tee -a /tmp/stage2-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-stage2-validation
          path: |
            /tmp/stage2-tests.log
            /tmp/stage2-lint.log
          if-no-files-found: warn
          retention-days: 7
