name: Access administration regression
on:
  push:
    branches: [main, feature/access-admin-stage1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  access-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sitebuilder_access_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated regression
        run: |
          set -eu
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /tmp/lint.log
          node --check assets/admin/access.js
          node --check assets/admin/groups.js
          php tests/access_admin_unit_test.php
          php tests/access_subject_identity_test.php
          php tests/disk_permission_admin_test.php
          php tests/sitebuilder_admin_config_test.php
          php tests/disk_user_search_test.php
      - name: Atomic bulk ACL with real PostgreSQL
        env:
          SB_TEST_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=sitebuilder_access_test'
          SB_TEST_PG_USER: postgres
          SB_TEST_PG_PASSWORD: postgres
          SB_ACCESS_TEST_ALLOW_RESET: '1'
        run: |
          php tests/access_admin_pg_test.php
          php tests/access_migration_registry_pg_test.php
          php tests/access_groups_pg_test.php
