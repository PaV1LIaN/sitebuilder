name: Disk admin permissions
on:
  push:
    paths:
      - 'components/disk/lib/DiskPermissionService.php'
      - 'components/disk/lib/BitrixDiskRightsService.php'
      - 'tests/disk_permission_admin_test.php'
      - 'tests/bitrix_disk_gate_test.php'
      - '.github/workflows/disk-admin-permissions.yml'
  pull_request:
    paths:
      - 'components/disk/lib/DiskPermissionService.php'
      - 'components/disk/lib/BitrixDiskRightsService.php'
      - 'tests/disk_permission_admin_test.php'
      - 'tests/bitrix_disk_gate_test.php'
      - '.github/workflows/disk-admin-permissions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l components/disk/lib/DiskPermissionService.php
      - run: php -l tests/disk_permission_admin_test.php
      - run: php -l components/disk/lib/BitrixDiskRightsService.php
      - run: php -l tests/bitrix_disk_gate_test.php
      - run: php tests/disk_permission_admin_test.php
      - run: php tests/bitrix_disk_gate_test.php
      - run: php tests/sitebuilder_admin_config_test.php
      - run: php tests/disk_delete_action_test.php
